[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vurnix"
version = "0.3.0"
description = "The honest gate for AI-written code: deterministic checkers that catch weakened tests, padded suites, phantom imports, and code that does not build."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "shiersa" }]
keywords = ["testing", "mutation-testing", "ai-agents", "code-quality", "quality-gate", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Build Tools",
]

[project.urls]
Homepage = "https://github.com/shiersa/vurnix"
Repository = "https://github.com/shiersa/vurnix"

[project.scripts]
vurnix = "vurnix.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/vurnix"]
